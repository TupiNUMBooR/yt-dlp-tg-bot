name: CI/CD

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ms-ingest
            image: ydtb-ingest
          - service: ms-server
            image: ydtb-server
          - service: ms-cloudflared
            image: ydtb-cloudflared
          - service: ms-downloader
            image: ydtb-downloader
          - service: ms-publisher
            image: ydtb-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tupinumboor/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload deploy files
        shell: bash
        run: |
          ssh "${{ secrets.SSH_ADDRESS }}" "mkdir -p ${{ vars.REMOTE_DIR }}"
          scp deploy/compose.yml "${{ secrets.SSH_ADDRESS }}:${{ vars.REMOTE_DIR }}/docker-compose.yml"

      - name: Deploy
        shell: bash
        run: |
          ssh "${{ secrets.SSH_ADDRESS }}" "
            set -eu
            cd ${{ vars.REMOTE_DIR }}
            docker-compose pull
            docker-compose down
            docker-compose up -d
          "
