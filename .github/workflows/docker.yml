name: docker

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tupinumboor
  REMOTE_DIR: ~/ydtb

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ms-ingest
            image: ydtb-ingest
          - service: ms-server
            image: ydtb-server
          - service: ms-cloudflared
            image: ydtb-cloudflared
          - service: ms-downloader
            image: ydtb-downloader
          - service: ms-publisher
            image: ydtb-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref_type == 'tag' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy tag
        id: vars
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deploy files
        shell: bash
        run: |
          ssh "${{ secrets.SSH_ADDRESS }}" "mkdir -p ${REMOTE_DIR}"
          scp deploy/compose.yml "${{ secrets.SSH_ADDRESS }}:${REMOTE_DIR}/docker-compose.yml"

      - name: Deploy
        shell: bash
        run: |
          ssh "${{ secrets.SSH_ADDRESS }}" "
            set -euo pipefail
            cd ${REMOTE_DIR}
            TAG=${{ steps.vars.outputs.tag }} docker-compose pull
            TAG=${{ steps.vars.outputs.tag }} docker-compose down
            TAG=${{ steps.vars.outputs.tag }} docker-compose up -d
          "
